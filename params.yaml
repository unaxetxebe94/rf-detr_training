task-name: prueba_rfdetr
model-type: large
seed: 42

data-src1: E:\Images for labelling\Left  # Dataset local
data-src2: \\10.139.140.20\Right # Dataset remoto
final-data: C:\training_dataset

preprocess:
  requires-preprocess: true
  saving-prob: 1.0  # Probabilidad de que se guarde una imagen aunque no tenga ninguna anotación
  resize: 0.33
  apply-roi: false
  train-ratio: 0.7
  test-ratio: 0.15
  val-ratio: 0.15
  augmentations-per-image: 2
  max-transforms-per-sample: 5

train:
  lr: 0.0001
  lr_encoder: 0.00015
  batch_size: 4
  grad_accum_steps: 6
  epochs: 15
  weight_decay: 1e-4
  tensorboard: true
  wandb: true
  project: lateral
  mlflow: false
  clearml: false
  run_test: true
  eval_max_dets: 300
